<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Органический Секвенсор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="controls-panel">
            <div class="control-group" id="bpm-group">
                <label for="bpm">BPM</label>
                <input type="number" id="bpm" value="120">
            </div>
            <div class="control-group file-controls">
                <button id="save-btn">Сохранить</button>
                <button id="load-btn">Загрузить</button>
            </div>
            <div class="control-group transport-controls">
                <button id="play-btn">PLAY</button>
                <button id="stop-btn">STOP</button>
                <button id="restart-btn">RESTART</button>
            </div>
        </div>
        <div id="sequencer-grid"></div>
    </div>
    <script src="sequencer.js"></script>
</body>
</html>
